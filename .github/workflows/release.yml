name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package binary
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/lossytrace" dist/package/
          cp README.md LICENSE-APACHE LICENSE-MIT dist/package/
          tar -C dist/package -czf "dist/lossytrace-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" .
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Generate CycloneDX SBOM
        run: python3 scripts/generate-sbom.py --output "dist/lossytrace-${GITHUB_REF_NAME}.cdx.json"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/lossytrace-${{ github.ref_name }}.cdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $prerelease --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
